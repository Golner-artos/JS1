<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация</title>
</head>
<body>
<form id="regForm" novalidate>
  <h1>Регистрация</h1>
 
  <div class="field">
    <label for="name">Имя</label>
    <input type="text" id="name" name="name" autocomplete="name">
    <div class="error" data-error-for="name"></div>
  </div>
 
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email">
    <div class="error" data-error-for="email"></div>
  </div>
 
  <div class="field">
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="new-password">
    <div class="error" data-error-for="password"></div>
  </div>
 
  <div class="field">
    <label for="confirmPassword">Подтверждение пароля</label>
    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
    <div class="error" data-error-for="confirmPassword"></div>
  </div>
 
  <div class="status" id="status">Заполнено полей: 0 из 4</div>
  <button type="submit">Зарегистрироваться</button>
  <div class="success" id="success"></div>
</form>
 
<script src="homework ex.js"></script>
</body>
</html>
